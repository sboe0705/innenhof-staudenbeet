    <line x1="33" y1="90" x2="43" y2="90"/>
    <line x1="33" y1="310" x2="43" y2="310"/>
  </g>
  <text x="440" y="372" font-size="12" fill="#6b6459" text-anchor="middle">7,00 m</text>
  <text x="26" y="204" font-size="12" fill="#6b6459" text-anchor="middle" transform="rotate(-90 26 204)">2,00 m</text>

  <text x="55" y="418" font-size="15" font-weight="bold" fill="#2c2c2c">Legende</text>

  <g font-size="13" fill="#2c2c2c">
    <rect x="55" y="430" width="22" height="18" fill="#e8d9a0" stroke="#8a8377"/>
    <text x="66" y="444" font-size="14" font-weight="bold" text-anchor="middle">R</text>
    <text x="88" y="444">Rutenhirse · Panicum virgatum `Heavy Metal` — 5 Stk</text>

    <rect x="55" y="454" width="22" height="18" fill="#b9c9e8" stroke="#8a8377"/>
    <text x="66" y="468" font-size="14" font-weight="bold" text-anchor="middle">B</text>
    <text x="88" y="468">Blauraute · Perovskia `Blue Spire` — 7 Stk</text>

    <rect x="55" y="478" width="22" height="18" fill="#8fa8d0" stroke="#8a8377"/>
    <text x="66" y="492" font-size="14" font-weight="bold" text-anchor="middle">K</text>
    <text x="88" y="492">Kugeldistel · Echinops ritro `Veitch's Blue` — 5 Stk</text>

    <rect x="55" y="502" width="22" height="18" fill="#b49ad6" stroke="#8a8377"/>
    <text x="66" y="516" font-size="14" font-weight="bold" text-anchor="middle">S</text>
    <text x="88" y="516">Steppen-Salbei · Salvia nemorosa `Caradonna` — 15 Stk</text>

    <rect x="55" y="526" width="22" height="18" fill="#f0b0a4" stroke="#8a8377"/>
    <text x="66" y="540" font-size="14" font-weight="bold" text-anchor="middle">F</text>
    <text x="88" y="540">Hohe Fetthenne · Sedum `Herbstfreude` — 12 Stk</text>

    <rect x="55" y="550" width="22" height="18" fill="#f2cf8a" stroke="#8a8377"/>
    <text x="66" y="564" font-size="14" font-weight="bold" text-anchor="middle">A</text>
    <text x="88" y="564">Schafgarbe · Achillea `Terracotta` — 9 Stk</text>

    <rect x="450" y="430" width="22" height="18" fill="#d8dcb0" stroke="#8a8377"/>
    <text x="461" y="444" font-size="14" font-weight="bold" text-anchor="middle">E</text>
    <text x="483" y="444">Silber-Ährengras · Achnatherum calamagrostis — 5 Stk</text>

    <rect x="450" y="454" width="22" height="18" fill="#a8d3e0" stroke="#8a8377"/>
    <text x="461" y="468" font-size="14" font-weight="bold" text-anchor="middle">N</text>
    <text x="483" y="468">Katzenminze · Nepeta `Walker's Low` — 12 Stk</text>

    <rect x="450" y="478" width="22" height="18" fill="#e8a8cc" stroke="#8a8377"/>
    <text x="461" y="492" font-size="14" font-weight="bold" text-anchor="middle">G</text>
    <text x="483" y="492">Blut-Storchschnabel · Geranium sanguineum — 10 Stk</text>

    <rect x="450" y="502" width="22" height="18" fill="#b6d6a0" stroke="#8a8377"/>
    <text x="461" y="516" font-size="14" font-weight="bold" text-anchor="middle">T</text>
    <text x="483" y="516">Thymian · Thymus praecox / vulgaris — 12 Stk</text>

    <rect x="450" y="526" width="22" height="18" fill="#8fc9bd" stroke="#8a8377"/>
    <text x="461" y="540" font-size="14" font-weight="bold" text-anchor="middle">H</text>
    <text x="483" y="540">Herbst-Blaugras · Sesleria autumnalis — 10 Stk</text>

    <text x="483" y="564" fill="#666" font-size="12">Zwiebeln (300 Stk) dazwischen streuen – kein fester Platz</text>
  </g>

  <line x1="55" y1="584" x2="825" y2="584" stroke="#ddd8cf" stroke-width="1"/>
  <text x="55" y="606" font-size="12" fill="#666">Pflanzabstände: Reihe hinten ca. 60–70 cm · Mitte ca. 35–40 cm · vorne ca. 30 cm.</text>
  <text x="55" y="624" font-size="12" fill="#666">Blockgrenzen sind Richtwerte – an den Rändern die Gruppen leicht ineinander laufen lassen, das wirkt natürlicher.</text>
  <text x="55" y="642" font-size="12" fill="#666">Nach der Pflanzung ganze Fläche 5–7 cm mit Splitt 8/16 mm mulchen.</text>
</svg>
