  <g font-size="11" fill="#2c2c2c">
    <text x="526" y="717"><tspan font-weight="bold">5 cm Lava-Mulch 8/16</tspan> – leicht, ca. 45 kg/m²</text>
    <text x="526" y="771"><tspan font-weight="bold">25–35 cm Dachgarten-Substrat</tspan> – mineralisch, mager</text>
    <text x="526" y="826">Filtervlies</text>
    <text x="526" y="844"><tspan font-weight="bold">6–8 cm Dränschicht</tspan> (Lava/Bims) oder Dränmatte</text>
    <text x="526" y="862">Schutzvlies 300 g/m²</text>
    <text x="526" y="880" fill="#c0392b"><tspan font-weight="bold">Abdichtung + Wurzelschutzbahn</tspan> – ca. 13 Jahre alt</text>
    <text x="526" y="898"><tspan font-weight="bold">Stahlbetondecke Tiefgarage</tspan> – Traglast ausreichend</text>
  </g>

  <g stroke="#6b6459" stroke-width="1" fill="none">
    <line x1="40" y1="706" x2="40" y2="856"/>
    <line x1="35" y1="706" x2="45" y2="706"/>
    <line x1="35" y1="856" x2="45" y2="856"/>
  </g>
  <text x="28" y="781" font-size="11" fill="#6b6459" text-anchor="middle" transform="rotate(-90 28 781)">ca. 40 cm</text>

  <text x="55" y="920" font-size="12" fill="#666">Flächenlast wassergesättigt inkl. Pflanzen: <tspan font-weight="bold">ca. 520 kg/m²</tspan> (≈ 7,3 t auf 14 m²). Mit Mutterboden + Granitsplitt wären es 750–850 kg/m².</text>
  <text x="55" y="938" font-size="12" fill="#666">Traglast beim Bau geprüft. Kein Substrataustausch – neu hinzu kommen nur Mulch (~45 kg/m²) und Aufwuchs. Oberkante bleibt gleich.</text>
</svg>
