  <rect x="55" y="310" width="770" height="20" fill="#b8b3ab"/>
  <text x="440" y="324" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">BETONKANTE / SITZKANTE – vorne niedrig bleiben</text>
  <text x="440" y="348" font-size="11" fill="#777" text-anchor="middle">Weg (Zugang, von hier aus wird gepflegt)</text>

  <g stroke="#6b6459" stroke-width="1" fill="none">
    <line x1="55" y1="378" x2="825" y2="378"/>
    <line x1="55" y1="373" x2="55" y2="383"/>
    <line x1="825" y1="373" x2="825" y2="383"/>
