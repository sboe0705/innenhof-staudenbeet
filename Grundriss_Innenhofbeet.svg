<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 950" width="880" height="950" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="950" fill="#fbfaf7"/>

  <text x="55" y="34" font-size="20" font-weight="bold" fill="#2c2c2c">Innenhof-Beet über Tiefgarage – Grundriss (Draufsicht), 7,00 × 2,00 m</text>
  <text x="55" y="55" font-size="13" fill="#666">Maßstab 1 : 100 · 113 Stauden (8,1 Stk/m²) · nur flachwurzelnde, frostharte Arten · Buchstabe = Art, Zahl = Stückzahl im Block</text>

  <rect x="55" y="66" width="770" height="18" fill="#7fa06a"/>
  <text x="440" y="79" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">HECKE (Hainbuche) – steht ebenfalls auf der Decke · 40 cm Abstand · Wurzelraum nicht anschneiden</text>

