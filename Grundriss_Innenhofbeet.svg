<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="660" fill="#fbfaf7"/>

  <text x="55" y="34" font-size="20" font-weight="bold" fill="#2c2c2c">Innenhof-Beet – Grundriss (Draufsicht), 7,00 × 2,00 m</text>
  <text x="55" y="55" font-size="13" fill="#666">Maßstab 1 : 100 · ca. 102 Stauden · Buchstabe = Pflanzenart, Zahl = Stückzahl im Block</text>

  <rect x="55" y="66" width="770" height="18" fill="#7fa06a"/>
  <text x="440" y="79" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">HECKE (Hainbuche) – ca. 40 cm Abstand halten, hier trockenster Bereich</text>

  <rect x="55" y="90" width="770" height="220" fill="#efe9dd" stroke="#8a8377" stroke-width="2"/>

