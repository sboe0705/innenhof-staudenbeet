  <g font-size="10" fill="#6b6459" text-anchor="start">
    <text x="833" y="120">hinten</text>
    <text x="833" y="132">80–120 cm</text>
    <text x="833" y="194">Mitte</text>
    <text x="833" y="206">40–70 cm</text>
    <text x="833" y="268">vorne</text>
    <text x="833" y="280">15–35 cm</text>
