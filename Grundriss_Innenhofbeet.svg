  <text x="440" y="372" font-size="12" fill="#6b6459" text-anchor="middle">7,00 m</text>
  <text x="26" y="204" font-size="12" fill="#6b6459" text-anchor="middle" transform="rotate(-90 26 204)">2,00 m</text>

  <text x="55" y="418" font-size="15" font-weight="bold" fill="#2c2c2c">Legende</text>

  <g font-size="13" fill="#2c2c2c">
    <rect x="55" y="430" width="22" height="18" fill="#b9c9e8" stroke="#8a8377"/>
    <text x="66" y="444" font-size="14" font-weight="bold" text-anchor="middle">P</text>
    <text x="88" y="444">Blauraute · Perovskia `Blue Spire` — 5 Stk</text>

    <rect x="55" y="454" width="22" height="18" fill="#d8dcb0" stroke="#8a8377"/>
    <text x="66" y="468" font-size="14" font-weight="bold" text-anchor="middle">E</text>
    <text x="88" y="468">Silber-Ährengras · Achnatherum calamagr. — 6 Stk</text>

    <rect x="55" y="478" width="22" height="18" fill="#ddd6ea" stroke="#8a8377"/>
    <text x="66" y="492" font-size="14" font-weight="bold" text-anchor="middle">M</text>
    <text x="88" y="492">Myrtenaster · Aster ericoides `Erlkönig` — 4 Stk</text>

    <rect x="55" y="502" width="22" height="18" fill="#b49ad6" stroke="#8a8377"/>
    <text x="66" y="516" font-size="14" font-weight="bold" text-anchor="middle">S</text>
    <text x="88" y="516">Steppen-Salbei · Salvia `Caradonna` — 13 Stk</text>

    <rect x="55" y="526" width="22" height="18" fill="#f0b0a4" stroke="#8a8377"/>
    <text x="66" y="540" font-size="14" font-weight="bold" text-anchor="middle">F</text>
    <text x="88" y="540">Fetthenne · Sedum telephium `Matrona` — 11 Stk</text>

    <rect x="55" y="550" width="22" height="18" fill="#f2cf8a" stroke="#8a8377"/>
    <text x="66" y="564" font-size="14" font-weight="bold" text-anchor="middle">A</text>
    <text x="88" y="564">Schafgarbe · Achillea `Terracotta` — 8 Stk</text>

    <rect x="450" y="430" width="22" height="18" fill="#cfe4e0" stroke="#8a8377"/>
    <text x="461" y="444" font-size="14" font-weight="bold" text-anchor="middle">C</text>
    <text x="483" y="444">Steinquendel · Calamintha nepeta — 8 Stk</text>

    <rect x="450" y="454" width="22" height="18" fill="#a8d3e0" stroke="#8a8377"/>
    <text x="461" y="468" font-size="14" font-weight="bold" text-anchor="middle">N</text>
    <text x="483" y="468">Katzenminze · Nepeta `Walker's Low` — 12 Stk</text>

    <rect x="450" y="478" width="22" height="18" fill="#b6d6a0" stroke="#8a8377"/>
    <text x="461" y="492" font-size="14" font-weight="bold" text-anchor="middle">T</text>
    <text x="483" y="492">Thymian · Thymus praecox / vulgaris — 18 Stk</text>

    <rect x="450" y="502" width="22" height="18" fill="#8fc9bd" stroke="#8a8377"/>
    <text x="461" y="516" font-size="14" font-weight="bold" text-anchor="middle">H</text>
    <text x="483" y="516">Herbst-Blaugras · Sesleria autumnalis — 12 Stk</text>

    <rect x="450" y="526" width="22" height="18" fill="#d986b4" stroke="#8a8377"/>
    <text x="461" y="540" font-size="14" font-weight="bold" text-anchor="middle">D</text>
    <text x="483" y="540">Karthäusernelke · Dianthus carthusianorum — 9 Stk</text>

    <rect x="450" y="550" width="22" height="18" fill="#f2c4d8" stroke="#8a8377"/>
    <text x="461" y="564" font-size="14" font-weight="bold" text-anchor="middle">G</text>
    <text x="483" y="564">Blut-Storchschnabel · Geranium sanguineum — 7 Stk</text>
  </g>

  <text x="55" y="586" font-size="12" fill="#666">Zwiebeln (250 Stk) dazwischen streuen – kein fester Platz. Nur kleine Wildarten: Allium sphaerocephalon, Crocus, Wildtulpe.</text>

  <line x1="55" y1="600" x2="825" y2="600" stroke="#ddd8cf" stroke-width="1"/>
  <text x="55" y="620" font-size="12" fill="#666">Pflanzabstände: hinten ca. 55 cm (3,3 Stk/m²) · Mitte 35 cm (8,2 Stk/m²) · vorne 28 cm (12,7 Stk/m²). Stückzahlen gegen die Reihenfläche gerechnet, nicht geschätzt.</text>
  <text x="55" y="638" font-size="12" fill="#666">Blockgrenzen sind Richtwerte – an den Rändern die Gruppen leicht ineinander laufen lassen, das wirkt natürlicher.</text>
  <text x="55" y="656" font-size="12" fill="#c0392b" font-weight="bold">Kein Spaten, keine Grabegabel! Nur Handschaufel – darunter liegt die ca. 13 Jahre alte Wurzelschutzbahn.</text>

  <!-- SCHNITT -->
  <text x="55" y="694" font-size="15" font-weight="bold" fill="#2c2c2c">Schichtaufbau über der Tiefgaragendecke (Schnitt, schematisch)</text>

