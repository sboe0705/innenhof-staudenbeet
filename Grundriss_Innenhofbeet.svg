    <text x="610" y="283" font-size="26" font-weight="bold">H<tspan font-size="17" font-weight="normal"> ×5</tspan></text>
    <text x="698" y="283" font-size="26" font-weight="bold">T<tspan font-size="17" font-weight="normal"> ×6</tspan></text>
    <text x="786" y="283" font-size="26" font-weight="bold">G<tspan font-size="17" font-weight="normal"> ×4</tspan></text>
